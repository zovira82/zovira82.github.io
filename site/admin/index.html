<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>留言管理后台</title>
  <style>
    :root{--green:#173a30;--green2:#2d6b54;--paper:#f5f3ec;--ink:#20302a;--muted:#748079;--line:#deddd5;--gold:#b78b4a;--danger:#a2443c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}.hidden{display:none!important}button,input,textarea,select{font:inherit}.login-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,rgba(99,143,113,.2),transparent 33%),linear-gradient(135deg,#112d26,#254b3d)}.login-card{width:min(440px,100%);padding:42px;border-radius:22px;background:rgba(250,249,244,.97);box-shadow:0 26px 80px rgba(0,0,0,.25)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green2)}h1{margin:10px 0 8px;font-family:"Noto Serif SC","Songti SC",serif;font-size:31px}.login-card p{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.8}.field{display:grid;gap:8px;margin-top:17px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #cfcec6;border-radius:10px;color:var(--ink);background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(45,107,84,.12)}.primary{width:100%;margin-top:24px;padding:13px 18px;border:0;border-radius:10px;color:#fff;background:var(--green);cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.login-error{min-height:22px;margin-top:12px!important;color:var(--danger)!important;font-size:13px!important}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,4vw,54px);color:#fff;background:var(--green);box-shadow:0 8px 24px rgba(12,36,29,.12)}.brand strong{display:block;font-size:17px}.brand span{font-size:11px;color:#bcd0c7}.logout{padding:8px 14px;border:1px solid rgba(255,255,255,.35);border-radius:8px;color:#fff;background:transparent;cursor:pointer}.main{width:min(1180px,calc(100% - 32px));margin:34px auto 60px}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.headline h2{margin:0 0 5px;font-family:"Noto Serif SC","Songti SC",serif;font-size:28px}.headline p{margin:0;color:var(--muted);font-size:13px}.refresh{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat strong{display:block;font-family:Georgia,serif;font-size:30px;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:14px}.filter{padding:9px 15px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;cursor:pointer}.filter.active{border-color:var(--green);color:#fff;background:var(--green)}.list{display:grid;gap:12px}.row{display:grid;grid-template-columns:110px minmax(0,1fr) 150px 190px;gap:18px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:#fff}.person strong{display:block;font-size:14px}.person span,.time{font-size:11px;color:var(--muted)}.message-text{line-height:1.65;font-size:14px}.tag{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;color:var(--green2);background:#edf4ef;font-size:10px}.status{font-size:12px;font-weight:700}.status.pending{color:var(--gold)}.status.approved{color:var(--green2)}.actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}.actions .approve{border-color:var(--green2);color:#fff;background:var(--green2)}.actions .delete{color:var(--danger)}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(7,22,17,.58)}.dialog{width:min(520px,100%);padding:28px;border-radius:18px;background:var(--paper);box-shadow:0 24px 80px rgba(0,0,0,.3)}.dialog h3{margin:0 0 18px}.dialog textarea{min-height:120px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.dialog-actions button{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.dialog-actions .save{border-color:var(--green);color:#fff;background:var(--green)}.notice{position:fixed;right:22px;bottom:22px;z-index:30;padding:12px 17px;border-radius:9px;color:#fff;background:var(--green);box-shadow:0 12px 30px rgba(0,0,0,.22)}@media(max-width:850px){.row{grid-template-columns:1fr}.actions{justify-content:flex-start}.stats{grid-template-columns:1fr}.headline{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section class="login-shell" id="loginView"><form class="login-card" id="loginForm"><span class="eyebrow">留言管理</span><h1>管理员登录</h1><p>该页面仅供网站管理员审核和维护公众寄语。</p><div class="field"><label for="email">管理员邮箱</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="loginButton" type="submit">进入管理后台</button><p class="login-error" id="loginError"></p></form></section>
  <section class="app hidden" id="appView"><header class="topbar"><div class="brand"><strong>石漠化治理公益科普</strong><span>留言管理后台</span></div><div><button class="logout" id="passwordButton">修改密码</button> <button class="logout" id="logoutButton">退出登录</button></div></header><main class="main"><div class="headline"><div><h2>山河回声管理</h2><p>审核、修改和维护访客提交的寄语</p></div><button class="refresh" id="refreshButton">刷新数据</button></div><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>全部寄语</span></div><div class="stat"><strong id="pendingCount">0</strong><span>待审核</span></div><div class="stat"><strong id="approvedCount">0</strong><span>已公开</span></div></div><div class="toolbar"><button class="filter active" data-filter="pending">待审核</button><button class="filter" data-filter="approved">已公开</button><button class="filter" data-filter="all">全部</button></div><div class="list" id="messageList"></div></main></section>
  <div class="modal hidden" id="editModal"><form class="dialog" id="editForm"><h3>编辑寄语</h3><input type="hidden" id="editId"><div class="field"><label for="editNickname">昵称</label><input id="editNickname" maxlength="12" required></div><div class="field"><label for="editLocation">关注方向</label><select id="editLocation"><option>生态守护</option><option>治理见闻</option><option>乡村变化</option><option>绿色生活</option><option>山河祝福</option></select></div><div class="field"><label for="editContent">寄语内容</label><textarea id="editContent" minlength="2" maxlength="80" required></textarea></div><div class="dialog-actions"><button type="button" id="cancelEdit">取消</button><button class="save" type="submit">保存修改</button></div></form></div>
  <div class="modal hidden" id="passwordModal"><form class="dialog" id="passwordForm"><h3>修改登录密码</h3><div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">再次输入新密码</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><p class="login-error" id="passwordError"></p><div class="dialog-actions"><button type="button" id="cancelPassword">取消</button><button class="save" type="submit">确认修改</button></div></form></div>
  <div class="notice hidden" id="notice"></div>
  <script>
    const SUPABASE_URL='https://oyyletlkfymoyustnrtq.supabase.co';
    const SUPABASE_KEY='sb_publishable_satjB9FUxw3OFmdRbqA25g_fvfj30d9';
    const ADMIN_UID='1a6bd99c-f493-432b-9d5c-c71150e0f369';
    const sessionKey='karst-admin-session-v1';
    let token='',records=[],currentFilter='pending';
    const $=id=>document.getElementById(id);
    function notify(text){$('notice').textContent=text;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),2200)}
    function authHeaders(extra={}){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${token}`,...extra}}
    function saveSession(value){sessionStorage.setItem(sessionKey,JSON.stringify(value))}
    function clearSession(){sessionStorage.removeItem(sessionKey);token=''}
    async function login(email,password){const response=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await response.json();if(!response.ok)throw new Error('邮箱或密码不正确');if(data.user?.id!==ADMIN_UID)throw new Error('该账号没有管理员权限');token=data.access_token;saveSession({access_token:token,user_id:data.user.id});return data}
    async function loadMessages(){const response=await fetch(`${SUPABASE_URL}/rest/v1/messages?select=id,nickname,content,location,approved,created_at&order=created_at.desc`,{headers:authHeaders()});if(response.status===401){logout();return}if(!response.ok)throw new Error('无法读取留言，请确认后台权限已设置');records=await response.json();render()}
    function render(){const pending=records.filter(x=>!x.approved).length;$('totalCount').textContent=records.length;$('pendingCount').textContent=pending;$('approvedCount').textContent=records.length-pending;const shown=records.filter(x=>currentFilter==='all'||(currentFilter==='approved'?x.approved:!x.approved));const list=$('messageList');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="empty">当前没有相关寄语</div>';return}shown.forEach(item=>{const row=document.createElement('article');row.className='row';const person=document.createElement('div');person.className='person';const name=document.createElement('strong');name.textContent=item.nickname;const time=document.createElement('span');time.textContent=new Date(item.created_at).toLocaleString('zh-CN');person.append(name,time);const body=document.createElement('div');const words=document.createElement('div');words.className='message-text';words.textContent=item.content;const tag=document.createElement('span');tag.className='tag';tag.textContent=item.location||'生态守护';body.append(words,tag);const status=document.createElement('div');status.className='status '+(item.approved?'approved':'pending');status.textContent=item.approved?'已公开':'待审核';const actions=document.createElement('div');actions.className='actions';if(!item.approved){const approve=document.createElement('button');approve.className='approve';approve.textContent='通过';approve.onclick=()=>updateRecord(item.id,{approved:true},'寄语已公开');actions.append(approve)}else{const hide=document.createElement('button');hide.textContent='撤回';hide.onclick=()=>updateRecord(item.id,{approved:false},'寄语已撤回');actions.append(hide)}const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>openEdit(item);const del=document.createElement('button');del.className='delete';del.textContent='删除';del.onclick=()=>deleteRecord(item.id);actions.append(edit,del);row.append(person,body,status,actions);list.append(row)})}
    async function updateRecord(id,changes,message){const response=await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${id}`,{method:'PATCH',headers:authHeaders({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify(changes)});if(!response.ok)throw new Error('操作失败');Object.assign(records.find(x=>x.id===id),changes);render();notify(message)}
    async function deleteRecord(id){if(!confirm('确定删除这条寄语吗？删除后无法恢复。'))return;const response=await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${id}`,{method:'DELETE',headers:authHeaders()});if(!response.ok){notify('删除失败');return}records=records.filter(x=>x.id!==id);render();notify('寄语已删除')}
    function openEdit(item){$('editId').value=item.id;$('editNickname').value=item.nickname;$('editLocation').value=item.location||'生态守护';$('editContent').value=item.content;$('editModal').classList.remove('hidden')}
    function logout(){clearSession();$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('password').value=''}
    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='';try{await login($('email').value.trim(),$('password').value);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadMessages()}catch(error){clearSession();$('loginError').textContent=error.message}finally{$('loginButton').disabled=false}});
    $('logoutButton').onclick=logout;$('passwordButton').onclick=()=>{$('passwordForm').reset();$('passwordError').textContent='';$('passwordModal').classList.remove('hidden')};$('cancelPassword').onclick=()=>$('passwordModal').classList.add('hidden');$('passwordForm').addEventListener('submit',async event=>{event.preventDefault();const next=$('newPassword').value;if(next!==$('confirmPassword').value){$('passwordError').textContent='两次输入的密码不一致';return}$('passwordError').textContent='';const response=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({password:next})});if(!response.ok){$('passwordError').textContent='密码修改失败，请稍后重试';return}$('passwordModal').classList.add('hidden');notify('密码已修改，请使用新密码登录');setTimeout(logout,1300)});$('refreshButton').onclick=()=>loadMessages().catch(error=>notify(error.message));document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));button.classList.add('active');currentFilter=button.dataset.filter;render()});$('cancelEdit').onclick=()=>$('editModal').classList.add('hidden');$('editForm').addEventListener('submit',async event=>{event.preventDefault();const id=Number($('editId').value);try{await updateRecord(id,{nickname:$('editNickname').value.trim(),location:$('editLocation').value,content:$('editContent').value.trim()},'修改已保存');$('editModal').classList.add('hidden')}catch{notify('保存失败')}});
    try{const saved=JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(saved?.access_token&&saved?.user_id===ADMIN_UID){token=saved.access_token;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');loadMessages().catch(error=>notify(error.message))}}catch{clearSession()}
  </script>
</body>
</html>
