<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>网站管理后台</title>
  <style>
    :root{--green:#173a30;--green2:#2d6b54;--paper:#f4f5f0;--ink:#20302a;--muted:#748079;--line:#dce2dc;--gold:#b78b4a;--danger:#a2443c;--shadow:0 18px 50px rgba(18,52,39,.09)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}.hidden{display:none!important}button,input,textarea,select{font:inherit}.login-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,rgba(99,143,113,.2),transparent 33%),linear-gradient(135deg,#112d26,#254b3d)}.login-card{width:min(440px,100%);padding:42px;border-radius:22px;background:rgba(250,249,244,.97);box-shadow:0 26px 80px rgba(0,0,0,.25)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green2)}h1{margin:10px 0 8px;font-family:"Noto Serif SC","Songti SC",serif;font-size:31px}.login-card p{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.8}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #cfd8d1;border-radius:10px;color:var(--ink);background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(45,107,84,.11)}.primary{width:100%;margin-top:24px;padding:13px 18px;border:0;border-radius:10px;color:#fff;background:var(--green);cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.login-error{min-height:22px;margin-top:12px!important;color:var(--danger)!important;font-size:13px!important}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px clamp(20px,4vw,54px);color:#fff;background:var(--green);box-shadow:0 8px 24px rgba(12,36,29,.12)}.brand strong{display:block;font-size:17px}.brand span{font-size:11px;color:#bcd0c7}.top-actions{display:flex;align-items:center;gap:8px}.logout{padding:8px 13px;border:1px solid rgba(255,255,255,.35);border-radius:8px;color:#fff;background:transparent;cursor:pointer}.main{width:min(1320px,calc(100% - 32px));margin:28px auto 60px}.module-tabs{display:flex;gap:8px;margin-bottom:24px;padding:6px;border:1px solid var(--line);border-radius:14px;background:#fff;width:max-content;box-shadow:0 8px 24px rgba(29,69,46,.04)}.module-tab{padding:10px 18px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.module-tab.active{color:#fff;background:var(--green)}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.headline h2{margin:0 0 5px;font-family:"Noto Serif SC","Songti SC",serif;font-size:28px}.headline p{margin:0;color:var(--muted);font-size:13px}.headline-actions{display:flex;gap:9px;flex-wrap:wrap}.refresh,.add-btn,.import-btn{padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.add-btn{border-color:var(--green);color:#fff;background:var(--green)}.import-btn{color:#795b2f;border-color:#d8c4a6;background:#fffaf1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.stat{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(28,63,43,.035)}.stat strong{display:block;font-family:Georgia,serif;font-size:29px;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}.filter{padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;cursor:pointer}.filter.active{border-color:var(--green);color:#fff;background:var(--green)}.list{display:grid;gap:11px}.row{display:grid;grid-template-columns:110px minmax(0,1fr) 150px 190px;gap:18px;align-items:center;padding:17px 19px;border:1px solid var(--line);border-radius:14px;background:#fff}.person strong{display:block;font-size:14px}.person span,.time{font-size:11px;color:var(--muted)}.message-text{line-height:1.65;font-size:14px}.tag{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;color:var(--green2);background:#edf4ef;font-size:10px}.status{font-size:12px;font-weight:700}.status.pending{color:var(--gold)}.status.approved{color:var(--green2)}.actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}.actions .approve{border-color:var(--green2);color:#fff;background:var(--green2)}.actions .delete{color:var(--danger)}.empty{padding:64px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:#fff}.data-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 150px 150px;gap:9px;margin-bottom:13px}.data-toolbar input,.data-toolbar select{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.data-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow)}.data-table{width:100%;min-width:1120px;border-collapse:collapse;font-size:12px}.data-table th{position:sticky;top:0;z-index:2;padding:12px 10px;text-align:left;color:#52655b;background:#edf3ee;white-space:nowrap}.data-table td{padding:11px 10px;border-top:1px solid #e8eee9;vertical-align:middle}.data-table tbody tr:hover td{background:#f7faf7}.data-table strong{font-size:12px}.data-table small{display:block;color:var(--muted);font-size:10px}.data-value{font:700 13px Georgia,serif;color:#1f6541;white-space:nowrap}.source-link{max-width:220px}.source-link a{color:#376e52;text-decoration:underline;text-underline-offset:2px}.data-state{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;white-space:nowrap}.data-state.live{color:#1f6541;background:#e8f4eb}.data-state.draft{color:#89672f;background:#fbf2df}.data-actions{display:flex;gap:5px}.data-actions button{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;white-space:nowrap}.data-actions .publish{color:#fff;border-color:var(--green2);background:var(--green2)}.data-actions .delete{color:var(--danger)}.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(7,22,17,.58)}.dialog{width:min(560px,100%);max-height:92vh;overflow:auto;padding:27px;border-radius:18px;background:var(--paper);box-shadow:0 24px 80px rgba(0,0,0,.3)}.dialog.data-dialog{width:min(860px,100%)}.dialog h3{margin:0 0 15px}.dialog textarea{min-height:92px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.field.wide{grid-column:1/-1}.check-field{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px}.check-field input{width:16px;height:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.dialog-actions button{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.dialog-actions .save{border-color:var(--green);color:#fff;background:var(--green)}.notice{position:fixed;right:22px;bottom:22px;z-index:40;max-width:min(420px,calc(100% - 44px));padding:12px 17px;border-radius:9px;color:#fff;background:var(--green);box-shadow:0 12px 30px rgba(0,0,0,.22)}@media(max-width:900px){.row{grid-template-columns:1fr}.actions{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.headline{align-items:flex-start;flex-direction:column}.data-toolbar{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:560px){.stats,.form-grid{grid-template-columns:1fr}.module-tabs{width:100%}.module-tab{flex:1}.topbar{flex-direction:column}.top-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <section class="login-shell" id="loginView"><form class="login-card" id="loginForm"><span class="eyebrow">网站管理</span><h1>管理员登录</h1><p>管理公众寄语和数据监测内容。</p><div class="field"><label for="email">管理员邮箱</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="loginButton" type="submit">进入管理后台</button><p class="login-error" id="loginError"></p></form></section>
  <section class="app hidden" id="appView"><header class="topbar"><div class="brand"><strong>石漠化治理公益科普</strong><span>网站管理后台</span></div><div class="top-actions"><button class="logout" id="passwordButton">修改密码</button><button class="logout" id="logoutButton">退出登录</button></div></header><main class="main"><nav class="module-tabs" aria-label="管理模块"><button class="module-tab active" data-module="messages">留言管理</button><button class="module-tab" data-module="data">数据监测</button></nav>
    <section id="messagesModule"><div class="headline"><div><h2>山河回声管理</h2><p>审核、修改和维护访客提交的寄语</p></div><button class="refresh" id="refreshMessagesButton">刷新数据</button></div><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>全部寄语</span></div><div class="stat"><strong id="pendingCount">0</strong><span>待审核</span></div><div class="stat"><strong id="approvedCount">0</strong><span>已公开</span></div></div><div class="toolbar"><button class="filter active" data-message-filter="pending">待审核</button><button class="filter" data-message-filter="approved">已公开</button><button class="filter" data-message-filter="all">全部</button></div><div class="list" id="messageList"></div></section>
    <section id="dataModule" class="hidden"><div class="headline"><div><h2>数据监测管理</h2><p>维护调研区、全国和省级图表数据</p></div><div class="headline-actions"><button class="import-btn" id="importSeedButton">导入当前底表</button><button class="refresh" id="refreshDataButton">刷新数据</button><button class="add-btn" id="addDataButton">新增数据</button></div></div><div class="stats"><div class="stat"><strong id="dataTotalCount">0</strong><span>全部记录</span></div><div class="stat"><strong id="dataPublishedCount">0</strong><span>已发布</span></div><div class="stat"><strong id="dataVerifiedCount">0</strong><span>已核验</span></div><div class="stat"><strong id="dataRegionCount">0</strong><span>覆盖对象</span></div></div><div class="data-toolbar"><input id="dataSearch" type="search" placeholder="搜索地区、指标或来源"><select id="dataScopeFilter"><option value="">全部范围</option><option>调研区</option><option>全国</option><option>省级</option><option>调查期</option><option>石漠化程度</option></select><select id="dataStatusFilter"><option value="">全部状态</option><option value="published">已发布</option><option value="draft">未发布</option><option value="verified">已核验</option><option value="pending">待复核</option></select></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>范围</th><th>地区/分组</th><th>年份</th><th>指标</th><th>数值</th><th>状态</th><th>来源</th><th>操作</th></tr></thead><tbody id="dataBody"><tr><td colspan="8">正在读取数据…</td></tr></tbody></table></div></section>
  </main></section>
  <div class="modal hidden" id="editModal"><form class="dialog" id="editForm"><h3>编辑寄语</h3><input type="hidden" id="editId"><div class="field"><label for="editNickname">昵称</label><input id="editNickname" maxlength="12" required></div><div class="field"><label for="editLocation">关注方向</label><select id="editLocation"><option>生态守护</option><option>治理见闻</option><option>乡村变化</option><option>绿色生活</option><option>山河祝福</option></select></div><div class="field"><label for="editContent">寄语内容</label><textarea id="editContent" minlength="2" maxlength="80" required></textarea></div><div class="dialog-actions"><button type="button" id="cancelEdit">取消</button><button class="save" type="submit">保存修改</button></div></form></div>
  <div class="modal hidden" id="dataModal"><form class="dialog data-dialog" id="dataForm"><h3 id="dataDialogTitle">新增数据</h3><input type="hidden" id="dataId"><div class="form-grid"><div class="field"><label for="dataScopeType">数据范围</label><select id="dataScopeType" required><option>调研区</option><option>全国</option><option>省级</option><option>调查期</option><option>石漠化程度</option></select></div><div class="field"><label for="dataProvince">省份</label><select id="dataProvince"><option value="">无</option><option>贵州</option><option>云南</option><option>四川</option></select></div><div class="field"><label for="dataRegion">地区或分组</label><input id="dataRegion" required></div><div class="field"><label for="dataYear">统计年份</label><input id="dataYear" type="number" min="1900" max="2100"></div><div class="field"><label for="dataPeriod">时间标签</label><input id="dataPeriod" required placeholder="如 2025 或 2016—2021"></div><div class="field"><label for="dataCategory">类别</label><input id="dataCategory" required placeholder="如 经济、生态、石漠化"></div><div class="field"><label for="dataIndicator">指标</label><input id="dataIndicator" required></div><div class="field"><label for="dataValue">数值</label><input id="dataValue" type="number" step="any" required></div><div class="field"><label for="dataUnit">单位</label><input id="dataUnit" required></div><div class="field"><label for="dataVerification">核验状态</label><select id="dataVerification"><option>待复核</option><option>已核验</option><option>需修订</option></select></div><div class="field wide"><label for="dataSourceTitle">来源标题</label><input id="dataSourceTitle"></div><div class="field"><label for="dataSourceOrg">发布机构</label><input id="dataSourceOrg"></div><div class="field"><label for="dataSourceUrl">来源链接</label><input id="dataSourceUrl" type="url"></div><div class="field wide"><label for="dataCaliber">统计口径</label><textarea id="dataCaliber"></textarea></div><label class="check-field wide"><input id="dataPublished" type="checkbox">发布到前端</label></div><p class="login-error" id="dataFormError"></p><div class="dialog-actions"><button type="button" id="cancelData">取消</button><button class="save" type="submit">保存数据</button></div></form></div>
  <div class="modal hidden" id="passwordModal"><form class="dialog" id="passwordForm"><h3>修改登录密码</h3><div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">再次输入新密码</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><p class="login-error" id="passwordError"></p><div class="dialog-actions"><button type="button" id="cancelPassword">取消</button><button class="save" type="submit">确认修改</button></div></form></div>
  <div class="notice hidden" id="notice"></div>
  <script src="../data/supabase-config.js"></script><script src="../data/region-database.js"></script>
  <script>
  (()=>{
    const config=window.SUPABASE_CONFIG||{},SUPABASE_URL=config.url,SUPABASE_KEY=config.key,ADMIN_UID='1a6bd99c-f493-432b-9d5c-c71150e0f369',sessionKey='karst-admin-session-v2';let token='',messages=[],dataRecords=[],messageFilter='pending';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function notify(text){$('notice').textContent=text;$('notice').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('notice').classList.add('hidden'),2600)}function authHeaders(extra={}){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${token}`,...extra}}function saveSession(value){sessionStorage.setItem(sessionKey,JSON.stringify(value))}function clearSession(){sessionStorage.removeItem(sessionKey);token=''}
    async function login(email,password){const response=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),data=await response.json();if(!response.ok)throw new Error('邮箱或密码不正确');if(data.user?.id!==ADMIN_UID)throw new Error('该账号没有管理员权限');token=data.access_token;saveSession({access_token:token,user_id:data.user.id});return data}async function api(path,options={}){const response=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...options,headers:authHeaders(options.headers||{})});if(response.status===401){logout();throw new Error('登录已过期，请重新登录')}if(!response.ok){let message='操作失败';try{const body=await response.json();message=body.message||body.hint||message}catch{}throw new Error(message)}if(response.status===204)return null;const text=await response.text();return text?JSON.parse(text):null}
    async function loadMessages(){messages=await api('messages?select=id,nickname,content,location,approved,created_at&order=created_at.desc');renderMessages()}function renderMessages(){const pending=messages.filter(x=>!x.approved).length;$('totalCount').textContent=messages.length;$('pendingCount').textContent=pending;$('approvedCount').textContent=messages.length-pending;const shown=messages.filter(x=>messageFilter==='all'||(messageFilter==='approved'?x.approved:!x.approved)),list=$('messageList');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="empty">当前没有相关寄语</div>';return}shown.forEach(item=>{const row=document.createElement('article');row.className='row';const person=document.createElement('div');person.className='person';const name=document.createElement('strong');name.textContent=item.nickname;const time=document.createElement('span');time.textContent=new Date(item.created_at).toLocaleString('zh-CN');person.append(name,time);const body=document.createElement('div'),words=document.createElement('div');words.className='message-text';words.textContent=item.content;const tag=document.createElement('span');tag.className='tag';tag.textContent=item.location||'生态守护';body.append(words,tag);const status=document.createElement('div');status.className='status '+(item.approved?'approved':'pending');status.textContent=item.approved?'已公开':'待审核';const actions=document.createElement('div');actions.className='actions';const visibility=document.createElement('button');visibility.className=item.approved?'':'approve';visibility.textContent=item.approved?'撤回':'通过';visibility.onclick=()=>updateMessage(item.id,{approved:!item.approved},item.approved?'寄语已撤回':'寄语已公开');const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>openMessageEdit(item);const del=document.createElement('button');del.className='delete';del.textContent='删除';del.onclick=()=>deleteMessage(item.id);actions.append(visibility,edit,del);row.append(person,body,status,actions);list.append(row)})}async function updateMessage(id,changes,message){await api(`messages?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(changes)});Object.assign(messages.find(x=>x.id===id),changes);renderMessages();notify(message)}async function deleteMessage(id){if(!confirm('确定删除这条寄语吗？删除后无法恢复。'))return;await api(`messages?id=eq.${id}`,{method:'DELETE'});messages=messages.filter(x=>x.id!==id);renderMessages();notify('寄语已删除')}function openMessageEdit(item){$('editId').value=item.id;$('editNickname').value=item.nickname;$('editLocation').value=item.location||'生态守护';$('editContent').value=item.content;$('editModal').classList.remove('hidden')}
    async function loadData(){try{dataRecords=await api('monitoring_data?select=*&order=updated_at.desc&limit=1000');renderData()}catch(error){dataRecords=[];renderData(error.message);throw error}}function filteredData(){const q=$('dataSearch').value.trim().toLowerCase(),scope=$('dataScopeFilter').value,status=$('dataStatusFilter').value;return dataRecords.filter(row=>(!scope||row.scope_type===scope)&&(!q||`${row.region}${row.indicator}${row.source_title}${row.source_org}`.toLowerCase().includes(q))&&(!status||(status==='published'?row.is_published:status==='draft'?!row.is_published:status==='verified'?row.verification_status==='已核验':row.verification_status==='待复核')))}function renderData(error=''){const published=dataRecords.filter(x=>x.is_published).length,verified=dataRecords.filter(x=>x.verification_status==='已核验').length;$('dataTotalCount').textContent=dataRecords.length;$('dataPublishedCount').textContent=published;$('dataVerifiedCount').textContent=verified;$('dataRegionCount').textContent=new Set(dataRecords.map(x=>x.region)).size;const rows=filteredData(),body=$('dataBody');if(error){body.innerHTML='<tr><td colspan="8"><div class="empty">数据库表尚未初始化，请先执行正式迁移脚本。</div></td></tr>';return}if(!rows.length){body.innerHTML='<tr><td colspan="8"><div class="empty">当前没有符合条件的数据</div></td></tr>';return}body.innerHTML=rows.map(row=>`<tr><td>${esc(row.scope_type)}</td><td><strong>${esc(row.region)}</strong><small>${esc(row.province||'')}</small></td><td>${esc(row.period_label)}</td><td><strong>${esc(row.indicator)}</strong><small>${esc(row.category)}</small></td><td class="data-value">${Number(row.value).toLocaleString('zh-CN',{maximumFractionDigits:4})} ${esc(row.unit)}</td><td><span class="data-state ${row.is_published?'live':'draft'}">${row.is_published?'已发布':'未发布'} · ${esc(row.verification_status)}</span></td><td class="source-link">${row.source_url?`<a href="${esc(row.source_url)}" target="_blank" rel="noopener">${esc(row.source_org||row.source_title||'查看来源')}</a>`:esc(row.source_org||row.source_title||'—')}</td><td><div class="data-actions"><button class="${row.is_published?'':'publish'}" data-action="toggle" data-id="${row.id}">${row.is_published?'撤回':'发布'}</button><button data-action="edit" data-id="${row.id}">编辑</button><button class="delete" data-action="delete" data-id="${row.id}">删除</button></div></td></tr>`).join('')}
    async function recordKey(row){const raw=[row.scope_type,row.province||'',row.region,row.period_label,row.indicator,row.unit,row.source_url||''].join('|'),bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return[...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('')}function openDataForm(row=null){$('dataForm').reset();$('dataFormError').textContent='';$('dataDialogTitle').textContent=row?'编辑数据':'新增数据';$('dataId').value=row?.id||'';$('dataScopeType').value=row?.scope_type||'调研区';$('dataProvince').value=row?.province||'';$('dataRegion').value=row?.region||'';$('dataYear').value=row?.statistical_year||'';$('dataPeriod').value=row?.period_label||'';$('dataCategory').value=row?.category||'';$('dataIndicator').value=row?.indicator||'';$('dataValue').value=row?.value??'';$('dataUnit').value=row?.unit||'';$('dataVerification').value=row?.verification_status||'待复核';$('dataSourceTitle').value=row?.source_title||'';$('dataSourceOrg').value=row?.source_org||'';$('dataSourceUrl').value=row?.source_url||'';$('dataCaliber').value=row?.caliber||'';$('dataPublished').checked=Boolean(row?.is_published);$('dataModal').classList.remove('hidden')}async function formRecord(){const record={scope_type:$('dataScopeType').value,province:$('dataProvince').value||null,region:$('dataRegion').value.trim(),statistical_year:$('dataYear').value?Number($('dataYear').value):null,period_label:$('dataPeriod').value.trim(),category:$('dataCategory').value.trim(),indicator:$('dataIndicator').value.trim(),value:Number($('dataValue').value),unit:$('dataUnit').value.trim(),source_title:$('dataSourceTitle').value.trim(),source_org:$('dataSourceOrg').value.trim(),source_url:$('dataSourceUrl').value.trim(),caliber:$('dataCaliber').value.trim(),verification_status:$('dataVerification').value,is_published:$('dataPublished').checked};if(record.is_published&&record.verification_status!=='已核验')throw new Error('发布前请将数据设为“已核验”');record.record_key=await recordKey(record);return record}async function saveData(event){event.preventDefault();$('dataFormError').textContent='';try{const record=await formRecord(),id=$('dataId').value;if(id)await api(`monitoring_data?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(record)});else await api('monitoring_data',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(record)});$('dataModal').classList.add('hidden');await loadData();notify(id?'数据已更新':'数据已新增')}catch(error){$('dataFormError').textContent=error.message}}async function toggleData(id){const row=dataRecords.find(x=>x.id===id),changes={is_published:!row.is_published};if(changes.is_published)changes.verification_status='已核验';await api(`monitoring_data?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(changes)});Object.assign(row,changes);renderData();notify(changes.is_published?'数据已发布':'数据已撤回')}async function deleteData(id){if(!confirm('确定删除这条数据吗？删除后无法恢复。'))return;await api(`monitoring_data?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});dataRecords=dataRecords.filter(x=>x.id!==id);renderData();notify('数据已删除')}
    async function seedRecords(){const db=window.REGION_DATABASE||{observations:[],nationalObservations:[]},survey=(db.observations||[]).map(row=>({scope_type:'调研区',province:row.province||null,region:row.region,statistical_year:Number(row.year)||null,period_label:String(row.year||''),category:row.category,indicator:row.indicator,value:Number(row.value),unit:row.unit,source_title:row.source||'',source_org:row.sourceOrg||'',source_url:row.url||'',caliber:row.caliber||'',verification_status:row.status||'已核验',is_published:(row.status||'已核验')==='已核验'})),national=(db.nationalObservations||[]).map(row=>({scope_type:row.scopeType||'全国',province:row.province||null,region:row.region,statistical_year:Number(row.year)||null,period_label:String(row.period||row.year||''),category:row.category,indicator:row.indicator,value:Number(row.value),unit:row.unit,source_title:row.source||'',source_org:row.sourceOrg||'',source_url:row.url||'',caliber:row.caliber||'',verification_status:row.status||'已核验',is_published:(row.status||'已核验')==='已核验'}));return Promise.all([...survey,...national].map(async row=>({...row,record_key:await recordKey(row)})))}async function importSeed(){if(!confirm('将当前本地底表导入数据库，并按唯一键更新重复记录吗？'))return;const button=$('importSeedButton');button.disabled=true;button.textContent='正在导入…';try{const rows=await seedRecords();for(let i=0;i<rows.length;i+=80)await api('monitoring_data?on_conflict=record_key',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+80))});await loadData();notify(`已导入 ${rows.length} 条数据`)}catch(error){notify(error.message.includes('monitoring_data')?'请先执行数据库正式迁移脚本':error.message)}finally{button.disabled=false;button.textContent='导入当前底表'}}
    function switchModule(module){document.querySelectorAll('.module-tab').forEach(x=>x.classList.toggle('active',x.dataset.module===module));$('messagesModule').classList.toggle('hidden',module!=='messages');$('dataModule').classList.toggle('hidden',module!=='data');if(module==='messages'&&!messages.length)loadMessages().catch(error=>notify(error.message));if(module==='data'&&!dataRecords.length)loadData().catch(()=>{})}function logout(){clearSession();$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('password').value=''}
    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='';try{await login($('email').value.trim(),$('password').value);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadMessages()}catch(error){clearSession();$('loginError').textContent=error.message}finally{$('loginButton').disabled=false}});document.querySelectorAll('.module-tab').forEach(button=>button.onclick=()=>switchModule(button.dataset.module));document.querySelectorAll('[data-message-filter]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-message-filter]').forEach(x=>x.classList.remove('active'));button.classList.add('active');messageFilter=button.dataset.messageFilter;renderMessages()});$('refreshMessagesButton').onclick=()=>loadMessages().catch(error=>notify(error.message));$('editForm').addEventListener('submit',async event=>{event.preventDefault();const id=Number($('editId').value);try{await updateMessage(id,{nickname:$('editNickname').value.trim(),location:$('editLocation').value,content:$('editContent').value.trim()},'修改已保存');$('editModal').classList.add('hidden')}catch(error){notify(error.message)}});$('cancelEdit').onclick=()=>$('editModal').classList.add('hidden');$('dataSearch').addEventListener('input',()=>renderData());$('dataScopeFilter').addEventListener('change',()=>renderData());$('dataStatusFilter').addEventListener('change',()=>renderData());$('refreshDataButton').onclick=()=>loadData().catch(error=>notify(error.message));$('addDataButton').onclick=()=>openDataForm();$('cancelData').onclick=()=>$('dataModal').classList.add('hidden');$('dataForm').addEventListener('submit',saveData);$('importSeedButton').onclick=importSeed;$('dataBody').addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const row=dataRecords.find(x=>x.id===button.dataset.id);if(!row)return;if(button.dataset.action==='edit')openDataForm(row);if(button.dataset.action==='toggle')toggleData(row.id).catch(error=>notify(error.message));if(button.dataset.action==='delete')deleteData(row.id).catch(error=>notify(error.message))});$('logoutButton').onclick=logout;$('passwordButton').onclick=()=>{$('passwordForm').reset();$('passwordError').textContent='';$('passwordModal').classList.remove('hidden')};$('cancelPassword').onclick=()=>$('passwordModal').classList.add('hidden');$('passwordForm').addEventListener('submit',async event=>{event.preventDefault();const next=$('newPassword').value;if(next!==$('confirmPassword').value){$('passwordError').textContent='两次输入的密码不一致';return}$('passwordError').textContent='';const response=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({password:next})});if(!response.ok){$('passwordError').textContent='密码修改失败，请稍后重试';return}$('passwordModal').classList.add('hidden');notify('密码已修改，请使用新密码登录');setTimeout(logout,1300)});try{const saved=JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(saved?.access_token&&saved?.user_id===ADMIN_UID){token=saved.access_token;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');loadMessages().catch(error=>notify(error.message))}}catch{clearSession()}
  })();
  </script>
