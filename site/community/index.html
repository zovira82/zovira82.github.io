  <section class="echo" id="echo"><div class="wrap"><div class="section-head reveal"><div><span class="section-no">01 · 山河回声墙</span><h2>寄语正在穿过群山</h2><div class="live-count"><i></i><span id="messageCount">0 条寄语正在流动</span></div></div></div></div><div class="tracks" id="tracks" aria-live="polite"><div class="track"><div class="marquee" style="--duration:88s"></div></div><div class="track reverse"><div class="marquee" style="--duration:96s"></div></div><div class="track"><div class="marquee" style="--duration:82s"></div></div><div class="track reverse"><div class="marquee" style="--duration:102s"></div></div></div></section>
  <section class="join"><div class="wrap join-grid"><div class="join-copy reveal"><span class="section-no">02 · 加入回声</span><h2>写下你眼中的<br>绿色改变</h2><p>可以是一句祝福，也可以是一次见闻。寄语提交并审核通过后，会加入上方的滚动队列，与更多声音一起穿行。</p><div class="voice-summary"><strong id="voiceTotal">0</strong><span>条声音汇集于此</span></div></div><form class="form-card reveal" id="messageForm"><div class="form-title"><h3>留下你的生态寄语</h3><span>审核通过后进入滚动留言墙</span></div><div class="field-row"><div class="field"><label for="nickname">昵称</label><input id="nickname" name="nickname" maxlength="12" required placeholder="例如：山野观察者"></div><div class="field"><label for="topic">关注方向</label><select id="topic" name="topic"><option>生态守护</option><option>治理见闻</option><option>乡村变化</option><option>绿色生活</option><option>山河祝福</option></select></div></div><div class="field"><label for="content">寄语内容</label><textarea id="content" name="content" minlength="2" maxlength="80" required placeholder="写下你想对这片山河说的话……"></textarea><div class="counter"><span id="charCount">0</span> / 80</div></div><button class="submit" type="submit">提交这条寄语 →</button><p class="form-tip">请保持友善、真诚，共同维护这片清朗的山河回声。</p></form></div></section>
  <footer class="footer"><div class="wrap footer-inner"><strong>石漠化治理公益科普</strong><span>生态保护 · 科普传播 · 公众参与</span></div></footer><div class="toast" id="toast">寄语已提交，审核后将加入回声墙</div>
  <script>
    const seedMessages=[
      {name:'绿叶使者',text:'愿每一座石山都能重新披上绿色。',tag:'山河祝福'},{name:'云岭行者',text:'在西畴看到的变化，让我相信长期行动真的有力量。',tag:'治理见闻'},{name:'山川守护者',text:'向一代又一代扎根石山的治理者致敬。',tag:'生态守护'},{name:'南风',text:'让更多人知道石漠化，也让更多人看见治理后的希望。',tag:'生态守护'},{name:'青禾',text:'绿水青山不只是一句话，而是村庄每天发生的改变。',tag:'乡村变化'},{name:'喀斯特观察员',text:'保护薄薄的土层，就是守住山区生活的根基。',tag:'治理见闻'},{name:'林间听雨',text:'愿森林长青，溪流常在，山里的孩子都能看见春天。',tag:'山河祝福'},{name:'石缝里的花',text:'从裸岩到绿洲，每一点新绿都来之不易。',tag:'生态守护'},{name:'一颗种子',text:'今天种下的树，会成为很多年后的荫凉。',tag:'绿色生活'},{name:'远山',text:'看见海雀的林海，才懂坚持几十年意味着什么。',tag:'治理见闻'},{name:'岩溶小记',text:'科普让复杂的治理过程变得更容易理解。',tag:'治理见闻'},{name:'溪畔',text:'希望生态修复也能带来更稳定的乡村生活。',tag:'乡村变化'},{name:'向绿而行',text:'少一点破坏，多一点耐心，自然会给出回答。',tag:'绿色生活'},{name:'春山',text:'愿每一次治理都尊重自然，也照顾当地人的生活。',tag:'生态守护'},{name:'黔山来客',text:'家乡的山正在变绿，这种变化值得被记录。',tag:'乡村变化'},{name:'云上茶园',text:'生态变好以后，山里的产业也有了新的可能。',tag:'乡村变化'},{name:'川南竹影',text:'竹林不仅是风景，也连接着生态与生计。',tag:'乡村变化'},{name:'循水而行',text:'水土保持看似缓慢，却在一点点改变整片山地。',tag:'生态守护'},{name:'地理爱好者',text:'希望更多课堂能讲到喀斯特与石漠化治理。',tag:'绿色生活'},{name:'青山有信',text:'时间会记住每一个为山河付出的人。',tag:'山河祝福'},{name:'微光',text:'个人的关注很小，但汇在一起就是持续的力量。',tag:'绿色生活'},{name:'山路弯弯',text:'路通了、山绿了，村庄也有了新的故事。',tag:'乡村变化'},{name:'木棉',text:'愿治理不是短暂的项目，而是长久的共同守护。',tag:'生态守护'},{name:'河谷风',text:'真实案例比口号更能让人理解生态修复。',tag:'治理见闻'},{name:'西南来信',text:'想把家乡这些年的绿色变化讲给更多人听。',tag:'乡村变化'},{name:'苔痕',text:'再小的植物，也在帮助土地慢慢恢复。',tag:'生态守护'},{name:'清野',text:'愿石山有树，村庄有路，年轻人也愿意回家。',tag:'山河祝福'},{name:'拾光者',text:'把治理前后的影像留下来，本身就是一种见证。',tag:'治理见闻'},{name:'候鸟',text:'每次路过西南群山，都能感受到绿色正在延伸。',tag:'山河祝福'},{name:'同路人',text:'保护生态不是少数人的事，我们都可以参与。',tag:'绿色生活'}
    ];
    const SUPABASE_URL='https://oyyletlkfymoyustnrtq.supabase.co';
    const SUPABASE_KEY='sb_publishable_satjB9FUxw3OFmdRbqA25g_fvfj30d9';
    let messages=[...seedMessages];
    const tracks=[...document.querySelectorAll('.marquee')];
    function makeMessage(item,isClone=false){const el=document.createElement('div');el.className='message'+(item.isNew&&!isClone?' new':'');const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=(item.name||'山').trim().charAt(0);const who=document.createElement('span');who.className='who';who.textContent=item.name;const words=document.createElement('span');words.className='words';words.textContent=item.text;const tag=document.createElement('span');tag.className='tag';tag.textContent=item.tag;el.append(avatar,who,words,tag);return el}
    function render(){tracks.forEach((track,index)=>{track.innerHTML='';const row=messages.filter((_,i)=>i%4===index);[...row,...row].forEach((item,i)=>track.appendChild(makeMessage(item,i>=row.length)))});const total=messages.length;document.getElementById('messageCount').textContent=total+' 条寄语正在流动';document.getElementById('voiceTotal').textContent=total}
    function showToast(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}
    async function loadApprovedMessages(){try{const response=await fetch(`${SUPABASE_URL}/rest/v1/messages?select=id,nickname,content,location,created_at&approved=eq.true&order=created_at.desc&limit=80`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error('load failed');const rows=await response.json();const remote=rows.map(row=>({id:row.id,name:row.nickname,text:row.content,tag:row.location||'生态守护',time:row.created_at}));messages=[...remote,...seedMessages];render()}catch{render()}}
    render();loadApprovedMessages();
    const form=document.getElementById('messageForm'),content=document.getElementById('content'),toast=document.getElementById('toast'),submitButton=form.querySelector('.submit');content.addEventListener('input',()=>document.getElementById('charCount').textContent=content.value.length);
    form.addEventListener('submit',async event=>{event.preventDefault();const data=new FormData(form);const item={nickname:String(data.get('nickname')||'').trim(),content:String(data.get('content')||'').trim(),location:String(data.get('topic')||'生态守护')};if(!item.nickname||item.content.length<2)return;submitButton.disabled=true;submitButton.textContent='正在提交…';try{const response=await fetch(`${SUPABASE_URL}/rest/v1/messages`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(item)});if(!response.ok)throw new Error('submit failed');form.reset();document.getElementById('charCount').textContent='0';showToast('寄语已提交，审核后将加入回声墙')}catch{showToast('暂时未能提交，请稍后再试')}finally{submitButton.disabled=false;submitButton.textContent='提交这条寄语 →'}});
    const nav=document.getElementById('nav');addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>30),{passive:true});document.getElementById('menu').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('open'));
    const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('on');io.unobserve(entry.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  </script><script src="../navigation.js?v=20260824-24"></script>
