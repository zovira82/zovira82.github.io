const cats=['全部','人物事迹','乡村蝶变','模式科普'];
const editorialIds=[1,2,3];
const editorial=document.getElementById('editorial'), list=document.getElementById('storyList'), filters=document.getElementById('filters'), empty=document.getElementById('empty');
function img(s){return s.image.includes('/')?s.image:'assets/'+s.image}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function drawEditorial(){const [a,b,c]=editorialIds.map(id=>stories.find(s=>s.id===id)); editorial.innerHTML=`<article class="lead" data-id="${a.id}"><img src="${img(a)}" alt="${esc(a.title)}"><div class="shade"></div><div class="lead-copy"><div class="meta"><span class="cat">${a.category}</span><span>${a.place}</span><span>${a.date}</span></div><h3>${a.title}</h3><p>${a.summary}</p><div class="read-more">阅读全文 <span>↗</span></div></div></article><div class="side">${[b,c].map(s=>`<article class="mini" data-id="${s.id}"><img src="${img(s)}" alt="${esc(s.title)}"><div class="shade"></div><div class="mini-copy"><div class="meta"><span class="cat">${s.category}</span><span>${s.place}</span></div><h3>${s.title}</h3><p>${s.summary}</p><div class="read-more">阅读全文 <span>↗</span></div></div></article>`).join('')}</div>`}
let active='全部';
function drawFilters(){filters.innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('')}
function drawList(){const data=stories.filter(s=>!editorialIds.includes(s.id) && (active==='全部'||s.category===active)); empty.hidden=data.length>0; list.innerHTML=data.map(s=>`<article class="story-row" data-id="${s.id}"><div class="story-media"><img src="${img(s)}" alt="${esc(s.title)}"><span class="cat-badge">${s.category}</span></div><div class="story-body"><div class="story-place">${s.place}</div><h3>${s.title}</h3><p>${s.summary}</p><div class="story-foot"><span>${s.publisher} · ${s.date}</span><span class="open">阅读全文 ↗</span></div></div></article>`).join('')}
function openModal(id){const s=stories.find(x=>x.id===Number(id));if(!s)return;document.getElementById('modalImg').src=img(s);document.getElementById('modalImg').alt=s.title;document.getElementById('modalMeta').innerHTML=`<span class="cat">${s.category}</span><span>${s.place}</span><span>${s.publisher}</span><span>${s.date}</span>`;document.getElementById('modalTitle').textContent=s.title;document.getElementById('modalLead').textContent=s.summary;document.getElementById('modalFacts').innerHTML=s.facts.map(x=>`<div class="fact">${x}</div>`).join('');const a=document.getElementById('modalSource');a.href=s.url;a.innerHTML=`查看原文 · ${s.publisher} <span>↗</span>`;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('click',e=>{const f=e.target.closest('[data-cat]');if(f){active=f.dataset.cat;drawFilters();drawList();return}const card=e.target.closest('[data-id]');if(card){openModal(card.dataset.id);return}if(e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
drawEditorial();drawFilters();drawList();
const navEl=document.getElementById('nav'),prog=document.getElementById('progress'),hero=document.getElementById('heroImage');function onScroll(){const y=scrollY;navEl.classList.toggle('scrolled',y>26);const max=document.documentElement.scrollHeight-innerHeight;prog.style.width=(max>0?Math.min(100,y/max*100):0)+'%';if(hero)hero.style.transform=`scale(${1.018+Math.min(y,500)*.000035}) translateY(${Math.min(y,420)*.018}px)`}addEventListener('scroll',onScroll,{passive:true});onScroll();const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
